[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optionsmarkets"
version = "0.1.0"
description = "Defined-risk options relative-value engine: arbitrage-free vol surface, RV forecasting, online recalibration, fractional-Kelly sizing, Schwab execution tickets"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.40"]                          # in-process live provider, no MCP needed
fast = ["py_lets_be_rational>=1.0", "numba>=0.59"]   # drop-in IV inversion, ~100x
learn = ["scikit-learn>=1.3"]                        # isotonic calibration
dev = ["pytest>=7.4", "pytest-cov", "hypothesis", "ruff"]

[project.scripts]
optionsmarkets = "optionsmarkets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
